name: Release On Version Bump

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Detect version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')

          const zeroSha = '0000000000000000000000000000000000000000'
          const beforeSha = process.env.BEFORE_SHA

          function readJson(filePath) {
            return JSON.parse(readFileSync(filePath, 'utf8'))
          }

          function readJsonAtRevision(revision, filePath) {
            try {
              const content = execFileSync('git', ['show', `${revision}:${filePath}`], { encoding: 'utf8', timeout: 5000 })
              return JSON.parse(content)
            }
            catch {
              return null
            }
          }

          const packageJson = readJson('package.json')
          const themeJson = readJson('theme.json')

          if (packageJson.version !== themeJson.version) {
            console.error(`Version mismatch: package.json=${packageJson.version}, theme.json=${themeJson.version}`)
            process.exit(1)
          }

          const currentVersion = packageJson.version
          let previousVersion = ''
          let versionChanged = true

          if (beforeSha && beforeSha !== zeroSha) {
            const prev = readJsonAtRevision(beforeSha, 'package.json')
            previousVersion = prev?.version ?? ''
            versionChanged = previousVersion !== currentVersion
          }

          console.log(`current_version=${currentVersion}`)
          console.log(`previous_version=${previousVersion}`)
          console.log(`version_changed=${versionChanged}`)
          console.log(`release_tag=v${currentVersion}`)
          NODE

      - name: Skip when version is unchanged
        if: steps.version.outputs.version_changed != 'true'
        run: |
          echo "package.json version has not changed. Skipping release."

      - name: Build project
        if: steps.version.outputs.version_changed == 'true'
        run: pnpm build

      - name: Verify theme package integrity
        if: steps.version.outputs.version_changed == 'true'
        run: gzip -t theme.tar.gz

      - name: Check release tag state
        if: steps.version.outputs.version_changed == 'true'
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags

          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${tag_sha}" != "${CURRENT_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists on ${tag_sha}, not on ${CURRENT_SHA}." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: steps.version.outputs.version_changed == 'true' && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create or update GitHub release
        if: steps.version.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            theme.tar.gz
